{% set name = "tjpcov" %}
{% set version = "0.6.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/tjpcov-{{ version }}.tar.gz
  sha256: 03eb5485d41667690bf52252e83cb09a3cac15a5ac6afc6f95cc88559daa5dfe


build:
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  noarch: python
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=61.0
    - setuptools_scm[toml] >=6.2
  run:
    - python >={{ python_min }}
    - scipy
    - numpy
    - jinja2
    - pyyaml
    - pyccl >=3.2
    - sacc >=0.12
    - camb
    - healpy
    - h5py
    - mpi4py
    - namaster >2

test:
  requires:
    - python {{ python_min }}
  imports:
    - tjpcov

about:
  home: https://github.com/LSSTDESC/TJPCov
  summary: Covariances for LSST DESC
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - matt-april
    - carlosggarcia
    - paulrogozenski
    - RyoTerasawa
    - rreischke
